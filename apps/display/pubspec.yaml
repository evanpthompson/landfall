name: display
description: Landfall display app for Fire TV, Android, and Raspberry Pi (Linux).
publish_to: none

environment:
  sdk: "^3.8.0"
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  get_it: ^9.2.1
  injectable: ^2.5.0
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.0
  path_provider: ^2.1.5
  landfall_shared:
    path: ../../packages/landfall_shared
  ui_kit:
    path: ../../packages/ui_kit
  landfall_client:
    path: ../../server/landfall_client
  flutter_secure_storage: ^9.2.2
  serverpod_auth_core_client: 3.4.6
  serverpod_auth_idp_client: 3.4.6
  serverpod_client: 3.4.6
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  xrandom: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  assets:
    - assets/companions/

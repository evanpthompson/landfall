name: display
description: Landfall display app for Fire TV, Android, and Raspberry Pi (Linux).
publish_to: none

environment:
  sdk: "^3.8.0"
  flutter: ">=3.29.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  get_it: ^9.2.1
  injectable: ^2.5.0
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.0
  path_provider: ^2.1.5
  landfall_shared:
    path: ../../packages/landfall_shared
  ui_kit:
    path: ../../packages/ui_kit
  landfall_client:
    path: ../../server/landfall_client
  flutter_secure_storage: ^9.2.2
  serverpod_auth_core_client: 3.4.6
  serverpod_auth_idp_client: 3.4.6
  serverpod_client: 3.4.6
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  xrandom: ^0.7.2
  uuid: ^4.5.3
  qr_flutter: ^4.1.0
  web: ^1.1.1
  google_fonts: ^8.1.0
  nsd: ^5.0.1
  http: ^1.2.0
  pinput: ^5.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  drift_dev: ^2.23.1
  test: ^1.30.0

flutter:
  uses-material-design: true
  assets:
    - assets/companions/
    # Landfall font registry (architecture_decisions.md §22). Bundled at
    # build time so theme.fontFamily references resolve offline — no
    # fonts.gstatic.com fetches at runtime. Populated by
    # scripts/fetch_font_registry.sh. The google_fonts package finds files
    # under assets/google_fonts/ automatically when allowRuntimeFetching=false
    # (set in lib/main.dart).
    - assets/google_fonts/
  fonts:
    # Inter is sourced from assets/google_fonts/ — the same files
    # scripts/fetch_font_registry.sh writes. A previous copy under
    # assets/fonts/Inter-*.ttf was committed as GitHub blob HTML (curled from
    # /blob/ instead of /raw/), which the engine fetched but rejected as
    # invalid; see test/pubspec_fonts_test.dart for the regression guard.
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    # Roboto is declared but backed by Inter glyphs. Flutter Web's Material
    # library hard-references "Roboto" at the engine level (independent of the
    # google_fonts package or theme.fontFamily), and will fetch it from
    # fonts.gstatic.com unless a local asset claims the family. Mapping it to
    # Inter satisfies the lookup, avoids the CSP-blocked fetch, and produces a
    # visually consistent result since the companion already uses Inter.
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    # --- Landfall font registry (architecture_decisions.md §22) ---
    # All families below are declared at the engine level so fontFamily: 'X'
    # resolves from bundled assets without involving the google_fonts package or
    # any network fetch. Populated by scripts/fetch_font_registry.sh.
    - family: Bebas Neue
      fonts:
        - asset: assets/google_fonts/BebasNeue-Regular.ttf
          weight: 400
    - family: DM Sans
      fonts:
        - asset: assets/google_fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/DMSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/google_fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Lexend-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/google_fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Lora-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/google_fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/google_fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Outfit-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/google_fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/google_fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/google_fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/google_fonts/Syne-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Syne-Bold.ttf
          weight: 700
    # --- Noto fallback families (pass 1 of 2) ---
    # Covers Latin/Latin-Extended/common symbols so FontFallbackManager does not
    # fetch from fonts.gstatic.com for typical companion content. Pass 2 (CJK +
    # script-specific subsets) added after a live network capture confirms which
    # families are actually still requested. Populated by fetch_font_registry.sh.
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
          weight: 400
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
          weight: 400
    - family: Noto Sans Math
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
          weight: 400

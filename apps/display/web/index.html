<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="display">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Landfall Companion</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #0B1021; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0B1021;
      gap: 14px;
    }
    #loading-status {
      color: #778199;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .progress-track {
      width: 140px; height: 3px;
      background: #1A2440;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #00E5FF, #7861FF);
      border-radius: 2px;
      width: 0%;
      transition: width 0.35s ease;
      animation: initial-crawl 5s ease-out forwards;
    }
    /* Crawls to 35% while the JS bundle downloads; JS hooks take over after. */
    @keyframes initial-crawl { from { width: 0% } to { width: 35% } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="progress-track"><div id="loading-bar"></div></div>
    <span id="loading-status">Downloading...</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

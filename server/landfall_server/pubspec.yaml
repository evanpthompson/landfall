name: landfall_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 3.4.6
  serverpod_auth_idp_server: 3.4.6
  serverpod_auth_core_server: 3.4.6
  landfall_shared:
    path: ../../packages/landfall_shared
  uuid: ^4.5.1
  crypto: ^3.0.3
  http: ^1.2.0
  yaml: ^3.1.2
  pointycastle: ^4.0.0
  mailer: ^7.1.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.6
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the companion Flutter web app and copy it to the server's web
    # directory. The companion shares the display package source tree but
    # uses a separate entrypoint (lib/companion_web_main.dart).
    #
    # --no-web-resources-cdn ships CanvasKit locally (no www.gstatic.com
    # fetch) so the companion works on the LAN even without WAN access —
    # required by the self-hosted, offline-first architecture and the strict
    # CSP in deploy/Caddyfile.
    #
    # dart2js (no --wasm): flutter_secure_storage_web 1.2.1, which the kiosk
    # depends on, still imports dart:html and cannot be compiled by dart2wasm.
    # The companion is a phone-side page where dart2js is sufficient.
    #
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\..\apps\display
        && flutter build web --target lib/companion_web_main.dart --base-href /app/ --no-web-resources-cdn
        && xcopy /E /I /Y build\web ..\..\server\landfall_server\web\app
      posix: |
        cd ../../apps/display
        flutter build web \
          --target lib/companion_web_main.dart \
          --base-href /app/ \
          --no-web-resources-cdn \
          --output ../../server/landfall_server/web/app

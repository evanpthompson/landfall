services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: landfall
      POSTGRES_PASSWORD: "XD_IbnCJ4ggdc97OdhZ0JL_WxvrVqCVz"
    volumes:
      - landfall_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "RzLiZFwD8_2YU1NphUMho2efg1wWHtXl"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: landfall_test
      POSTGRES_PASSWORD: "yhpSiFDTjevAj6RGiQ5Hulfy5IQkYVKf"
    volumes:
      - landfall_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "-MXsuOKSOcMV5EMWa1dhQppDu4AQ_SKS"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  landfall_data:
  landfall_test_data:

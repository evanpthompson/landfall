name: landfall_workspace
publish_to: none

environment:
  sdk: "^3.8.0"

workspace:
  - apps/display
  - server/landfall_server
  - server/landfall_client
  - server/landfall_mcp
  - packages/landfall_shared
  - packages/ui_kit

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    test:
      run: dart run melos exec --fail-fast -- dart test
      description: Run tests in pure-Dart packages (non-Flutter)
      packageFilters:
        dirExists: test
        flutter: false

    test:flutter:
      run: dart run melos exec --fail-fast -- flutter test
      description: Run flutter tests in all packages
      packageFilters:
        flutter: true
        dirExists: test

    analyze:
      run: dart run melos exec -- dart analyze --fatal-infos
      description: Analyze all packages

    build:
      run: dart run melos exec -- dart run build_runner build --delete-conflicting-outputs
      description: Run build_runner in all packages
      packageFilters:
        dirExists: lib

    clean:
      run: dart run melos exec -- flutter clean
      description: Clean all packages
      packageFilters:
        flutter: true

    build:apk:
      run: bash tools/scripts/build_apk.sh
      description: Build Fire TV release APK

    build:linux:
      run: bash tools/scripts/build_linux.sh
      description: Build Linux release binary (Raspberry Pi / desktop)

    build:linux:arm64:
      run: bash tools/scripts/build_linux.sh --arch arm64
      description: Build Linux arm64 release binary for Raspberry Pi

services:
  server:
    image: landfall-server:latest
    build:
      context: ..
      dockerfile: server/landfall_server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      SERVERPOD_PASSWORD_redis: ${REDIS_PASSWORD}
      # The server runs on the compose bridge network and cannot reach the LAN
      # mDNS multicast group, so the in-process broadcaster is disabled here.
      # The Pi host's avahi-daemon publishes _landfall._tcp instead, via the
      # /etc/avahi/services/landfall.service file rendered by firstboot.sh.
      LANDFALL_MDNS_BROADCAST: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "127.0.0.1:8082:8082"
    # Serverpod ships a TCP health endpoint on the main API port. We exec
    # `nc` (busybox in the runtime image) rather than curl to avoid pulling
    # in an extra package, and the test only verifies the listener — full
    # health is implied by the absence of restart-on-crash bursts above.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # AUTH-aware ping. Without the password redis-cli responds NOAUTH and
    # the healthcheck would never go green even when the server is fine.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      server:
        condition: service_healthy
    # Caddy's admin API on :2019 always answers locally; we hit /config/
    # which returns the current config tree only when Caddy is healthy.
    # Use 127.0.0.1 explicitly — Alpine's wget resolves "localhost" to ::1
    # first, but Caddy's admin listener binds IPv4 only, causing a spurious
    # "Connection refused" and an (unhealthy) status even when Caddy is fine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2019/config/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: >
      sh -c "
        apt-get update -q &&
        apt-get install -y --no-install-recommends cron procps &&
        echo '0 2 * * * /backup.sh' | crontab - &&
        cron -f
      "
    depends_on:
      postgres:
        condition: service_healthy
    # `pgrep cron` succeeds only while the cron supervisor is alive — if
    # the entrypoint script ever dies, the container is marked unhealthy
    # and `restart: unless-stopped` brings it back. Combined, this means
    # nightly backups recover from any single-process failure.
    #
    # procps is installed above because pgrep is not in the base image. It
    # was not, and the check had therefore failed every minute since the
    # container started — 4,333 consecutive failures on the live Pi, which
    # means a genuine backup failure would have looked exactly the same as
    # the permanent false alarm everyone had learned to ignore.
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_data:

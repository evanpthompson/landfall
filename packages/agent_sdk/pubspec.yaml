name: landfall_agent_sdk
description: >-
  Official Dart SDK for pushing cards to a Landfall display from agents,
  scripts, and automations. Push a card in three lines of code.
version: 0.1.0
homepage: https://github.com/ethompson/landfall
repository: https://github.com/ethompson/landfall
issue_tracker: https://github.com/ethompson/landfall/issues
documentation: https://pub.dev/documentation/landfall_agent_sdk/latest/

topics:
  - landfall
  - agent
  - dashboard
  - smart-home
  - automation

environment:
  sdk: "^3.8.0"

resolution: workspace

dependencies:
  http: ">=1.1.0 <2.0.0"

dev_dependencies:
  lints: ">=6.0.0 <7.0.0"
  test: ^1.25.5

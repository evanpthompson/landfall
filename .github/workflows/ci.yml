name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deployment_tests:
    name: Deployment Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deployment tests
        run: bash deploy/tests/run_deploy_tests.sh

  android_apk:
    name: Fire TV APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install workspace deps
        run: dart pub get

      - name: Build Fire TV APK
        run: bash tools/scripts/build_apk.sh

      - name: Assert APK artifact exists
        run: test -f apps/display/build/app/outputs/flutter-apk/app-release.apk

  companion_web:
    name: Companion Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install workspace deps
        run: dart pub get

      - name: Build companion web app
        working-directory: apps/display
        run: flutter build web --release --target lib/companion_web_main.dart

      - name: Assert build output exists
        run: |
          test -f apps/display/build/web/index.html
          test -f apps/display/build/web/main.dart.js

  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: landfall_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 9090:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install workspace deps (includes Melos)
        run: dart pub get

      - name: Dependency vulnerability audit (A03:2025)
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          $(go env GOPATH)/bin/osv-scanner --lockfile=pubspec.lock

      - name: Write test passwords.yaml
        # These are CI-only test credentials for an ephemeral container.
        # Production secrets are never stored here — see docs/self_hosting_guide.md.
        run: |
          cat > server/landfall_server/config/passwords.yaml << 'YAML'
          test:
            database: 'ci_test_password'
            serviceSecret: 'ci-service-secret-for-testing-only'
            emailSecretHashPepper: 'ci-email-pepper-for-testing-only'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-for-testing-only'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper-for-testing-only'
            apiKeyManagementToken: 'test-management-token'
            apiKeyHmacSecret: 'test-hmac-secret'
            stripeWebhookSecret: 'test-stripe-secret'
            oauthTokenEncryptionKey: 'aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899'
            photoSigningSecret: 'test-photo-signing-secret'
            googleClientId: 'ci-google-client-id'
            googleClientSecret: 'ci-google-client-secret'
            googleOAuthRedirectUri: 'http://localhost:8080/calendar/oauth/callback'
            calendarOauthSetupToken: 'test-setup-token'
            # Service account keys are left blank in CI: photo unit tests stub
            # the auth provider, and integration tests use the OAuth fallback.
            googleServiceAccountEmail: ''
            googleServiceAccountPrivateKey: ''
          YAML

      - name: Analyze
        run: dart run melos run analyze

      - name: Test (Dart packages)
        run: dart run melos run test

      - name: Test (Flutter packages)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum dart run melos run test:flutter

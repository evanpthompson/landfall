name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: landfall_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 9090:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install workspace deps (includes Melos)
        run: dart pub get

      - name: Dependency vulnerability audit (A03:2025)
        run: |
          cd server/landfall_server && dart pub audit || true
          cd ../../apps/display && flutter pub audit || true
        # `|| true` prevents a single advisory from blocking all other checks.
        # Review output above and upgrade affected packages as advisories appear.

      - name: Write test passwords.yaml
        # These are CI-only test credentials for an ephemeral container.
        # Production secrets are never stored here — see docs/self_hosting_guide.md.
        run: |
          cat > server/landfall_server/config/passwords.yaml << 'YAML'
          test:
            database: 'ci_test_password'
            serviceSecret: 'ci-service-secret-for-testing-only'
            emailSecretHashPepper: 'ci-email-pepper-for-testing-only'
            jwtHmacSha512PrivateKey: 'ci-jwt-key-for-testing-only'
            jwtRefreshTokenHashPepper: 'ci-jwt-refresh-pepper-for-testing-only'
            apiKeyManagementToken: 'test-management-token'
            apiKeyHmacSecret: 'test-hmac-secret'
            stripeWebhookSecret: 'test-stripe-secret'
            oauthTokenEncryptionKey: 'aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899'
            googleClientId: 'ci-google-client-id'
            googleClientSecret: 'ci-google-client-secret'
            googleOAuthRedirectUri: 'http://localhost:8080/calendar/oauth/callback'
          YAML

      - name: Analyze
        run: dart run melos run analyze

      - name: Test (Dart packages)
        run: dart run melos run test

      - name: Test (Flutter packages)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum dart run melos run test:flutter

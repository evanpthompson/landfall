name: Golden Tests

on:
  pull_request:
    branches: [main]

jobs:
  golden:
    name: Golden Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Run golden tests
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb fonts-noto
          xvfb-run --auto-servernum melos run test:flutter
        env:
          CI: true

      - name: Upload golden failures as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: "**/test/**/failures/"
          retention-days: 7
